<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autor cadastrado</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<header>
    <h1>Autor cadastrado!</h1>
</header>

<main>
    <p><strong>Nome:</strong> <span th:text="${autor.nome}"></span></p>
    <p><strong>Nacionalidade:</strong> <span th:text="${autor.nacionalidade}"></span></p>
</main>

<nav>
    <a th:href="@{/autores/novo}">Cadastrar outro</a>
    <a th:href="@{/autores}">Voltar</a>
</nav>
</body>
</html>
