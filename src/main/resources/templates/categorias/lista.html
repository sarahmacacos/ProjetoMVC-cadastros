<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categorias</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<header>
    <h1>Categorias cadastradas</h1>
</header>

<main>
    <p th:if="${categorias.isEmpty()}">Nenhuma categoria cadastrada ainda.</p>

    <table th:unless="${categorias.isEmpty()}">
        <thead>
        <tr>
            <th>Nome</th>
            <th>Ação</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="categoria : ${categorias}">
            <td th:text="${categoria.nome}"></td>
            <td>
                <form th:action="@{/categorias/excluir/{id}(id=${categoria.id})}" method="post">
                    <button type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p><strong>Total de categorias: <span th:text="${categorias.size()}">0</span></strong></p>
</main>

<nav>
    <a th:href="@{/categorias/nova}">Cadastrar nova categoria</a>
    <a th:href="@{/}">Voltar ao menu</a>
</nav>
</body>
</html>
